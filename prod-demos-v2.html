<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Demos - Dom Shaw</title>
<meta name="description" content="Production and mixing demos by Dom Shaw, including work with Waterlog and Cadmium Red.">

<style>
@font-face {
  font-family: 'Press Start 2P';
  src: url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --production: #f0b43c;
  --performing: #c93b4d;
  --mixing: #3a86ff;
  --engineering: #4fbf74;
  --asst-eng: #9b6bdb;
  --neutral: #cfd8cf;
  --neutral-dark: #8e9890;
  --ink: #1c1c1c;
  --shadow: #194242;
  --border: #333;
  --silver-1: #f3f4f7;
  --silver-2: #d9dde4;
  --silver-3: #b7bcc5;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Press Start 2P', cursive;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

body {
  background-image: url("assets/images/home3.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  min-height: 100vh;
  color: #083c3c;
}

.wrapper {
  max-width: 720px;
  margin: 36px auto;
  padding: 10px;
}

.panel {
  backdrop-filter: blur(2px);
  background: rgba(255,255,255,0.16);
  border: 3px solid #8c3b2a;
  padding: 20px;
  box-shadow: 4px 4px var(--shadow);
}

/* ---------- Title bar + home button ---------- */
.title-wrap {
  position: relative;
  margin-bottom: 22px;
}

.title {
  text-align: center;
  font-size: 13px;
  line-height: 1.4;
  margin-bottom: 0;
  color: #fff7d6;
  padding: 14px 132px;
  border: 3px solid #5d2418;
  background: linear-gradient(180deg, #b45a3c 0%, #8c3b2a 52%, #6e2a1e 100%);
  box-shadow: inset 0 3px rgba(255,255,255,0.25), inset 0 -4px rgba(0,0,0,0.25), 0 0 0 3px rgba(255,241,188,0.15), 4px 4px #3f1b13;
  text-shadow: 2px 2px rgba(0,0,0,0.45);
  letter-spacing: 1px;
}

.home-btn {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 34px;
  padding: 7px 10px;
  color: #414854;
  text-decoration: none;
  font-size: 7px;
  line-height: 1;
  border: 2px solid var(--border);
  background: linear-gradient(180deg, var(--silver-1) 0%, var(--silver-2) 45%, var(--silver-3) 100%);
  box-shadow: inset 0 2px rgba(255,255,255,0.55), inset 0 -2px rgba(0,0,0,0.12), 2px 2px #3f1b13;
  letter-spacing: 0.4px;
  z-index: 2;
}

.home-btn:hover {
  transform: translateY(calc(-50% - 1px));
}

.home-btn:active {
  transform: translateY(calc(-50% + 1px));
  box-shadow: inset 0 2px rgba(255,255,255,0.45), inset 0 -2px rgba(0,0,0,0.16), 1px 1px #3f1b13;
}

.home-btn-icon {
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  position: relative;
}

.home-btn-icon::before,
.home-btn-icon::after {
  content: '';
  position: absolute;
  background: #414854;
}

.home-btn-icon::before {
  left: 0;
  top: 4px;
  width: 7px;
  height: 4px;
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
}

.home-btn-icon::after {
  left: 5px;
  top: 4px;
  width: 7px;
  height: 4px;
}

/* ---------- Card shells (shared with credits page) ---------- */
.card-shell {
  position: relative;
  background: linear-gradient(180deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.2) 100%);
  border: 3px solid var(--border);
  padding: 10px;
  box-shadow: inset 0 -3px rgba(0,0,0,0.22), 4px 4px #000;
  overflow: hidden;
}

.card-shell::before {
  content: '';
  position: absolute;
  top: -6px;
  left: 14px;
  right: 14px;
  height: 6px;
  background: #999;
  border: 2px solid var(--border);
  border-bottom: none;
}

.card-shell::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 62%;
  height: 3px;
  background: rgba(0,0,0,0.28);
}

/* ---------- Player + info ---------- */
.top-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
  gap: 14px;
  margin-bottom: 18px;
}

.player,
.info-shell {
  min-width: 0;
}

.info-shell {
  display: flex;
}

.screen {
  background: linear-gradient(180deg, var(--silver-1) 0%, var(--silver-2) 45%, var(--silver-3) 100%);
  border: 2px solid var(--border);
  box-shadow: inset 0 2px rgba(255,255,255,0.55), inset 0 -2px rgba(0,0,0,0.12);
  color: #414854;
  padding: 10px;
  min-height: 52px;
  font-size: 8px;
  line-height: 1.5;
  letter-spacing: 0.3px;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 10px;
}

.btn {
  display: block;
  text-align: center;
  font-size: 8px;
  padding: 9px 10px;
  border: 2px solid var(--border);
  color: #fff;
  cursor: pointer;
  user-select: none;
  box-shadow: inset 0 -3px rgba(0,0,0,0.25), 2px 2px #000;
  text-shadow: 1px 1px rgba(0,0,0,0.45);
}

.btn-play { background: var(--engineering); }
.btn-stop { background: var(--performing); }

.btn:active {
  transform: translateY(1px);
  box-shadow: inset 0 -2px rgba(255,255,255,0.22), 1px 1px #000;
}

.btn.disabled {
  opacity: 0.45;
  cursor: not-allowed;
  filter: grayscale(0.5);
}

.cursor::after { content: "_"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.info {
  --meta-label-color: var(--production);
  flex: 1;
  min-width: 0;
  min-height: 80px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-content: start;
  column-gap: 12px;
  row-gap: 8px;
  font-size: 11px;
  line-height: 1.55;
  color: #000000;
  padding: 8px;
  border: 2px solid rgba(51,51,51,0.7);
  background: rgba(255,255,255,0.48);
}

.info:empty::before {
  content: "LOAD A CARTRIDGE TO VIEW CREDITS AND DATA.";
  grid-column: 1 / -1;
}

.info .label {
  white-space: nowrap;
  color: var(--meta-label-color);
  text-shadow:
    1px 0 rgba(0,0,0,0.72),
    0 1px rgba(0,0,0,0.72);
}

.info .value {
  min-width: 0;
  color: #000000;
  overflow-wrap: anywhere;
}

/* ---------- Cartridge grid ---------- */
.discography {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  position: relative;
}

.album {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--neutral);
  border: 3px solid var(--border);
  padding: 6px;
  cursor: pointer;
  box-shadow: inset 0 -3px rgba(0,0,0,0.24), 2px 2px #000;
  transition: transform 0.1s;
}

.album:active { transform: scale(0.94); }

.album.loaded {
  outline: 3px solid rgba(255,255,255,0.66);
  outline-offset: -3px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%   { box-shadow: inset 0 -3px rgba(0,0,0,0.24), 2px 2px #000, 0 0 0px rgba(240,180,60,0); }
  50%  { box-shadow: inset 0 -3px rgba(0,0,0,0.24), 2px 2px #000, 0 0 8px rgba(240,180,60,0.95); }
  100% { box-shadow: inset 0 -3px rgba(0,0,0,0.24), 2px 2px #000, 0 0 0px rgba(240,180,60,0); }
}

.album::before {
  content: '';
  position: absolute;
  top: -6px;
  left: 10px;
  right: 10px;
  height: 6px;
  background: #999;
  border: 2px solid var(--border);
  border-bottom: none;
  z-index: 3;
}

.album::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 3px;
  background: rgba(0,0,0,0.28);
  z-index: 3;
}

.album p {
  position: relative;
  z-index: 4;
  display: block;
  margin: 0 0 6px;
  padding: 6px 7px;
  font-size: 10px;
  line-height: 1.45;
  text-align: center;
  color: #fffdf2;
  text-shadow: 0 2px 0 rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.8);
  background: linear-gradient(180deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.55) 100%);
  border: 2px solid rgba(255,255,255,0.22);
  box-shadow: inset 0 1px rgba(255,255,255,0.16);
}

.album img {
  order: -1;
  display: block;
  width: 100%;
  margin-bottom: 4px;
  padding: 6px;
  background: var(--production);
  border: 2px solid var(--border);
  image-rendering: pixelated;
}

.cursor-arrow {
  position: absolute;
  z-index: 5;
  width: 0;
  height: 0;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-left: 6px solid #5d2418;
  animation: float 0.5s infinite alternate;
  pointer-events: none;
}
@keyframes float { from { transform: translateY(-1px); } to { transform: translateY(1px); } }

/* ---------- External stream module ---------- */
.external-module {
  display: none;
  margin: 0 0 18px;
  border: 3px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.2) 100%);
  box-shadow: inset 0 -3px rgba(0,0,0,0.22), 4px 4px #000;
}

.external-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 8px;
  padding: 7px 8px;
  color: #414854;
  background: linear-gradient(180deg, var(--silver-1) 0%, var(--silver-2) 45%, var(--silver-3) 100%);
  border-bottom: 2px solid var(--border);
  box-shadow: inset 0 2px rgba(255,255,255,0.55), inset 0 -2px rgba(0,0,0,0.12);
}

.external-title {
  letter-spacing: 0.3px;
}

.external-buttons {
  display: flex;
  gap: 4px;
}

.win-btn {
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: #414854;
  border: 2px solid var(--border);
  background: linear-gradient(180deg, var(--silver-1) 0%, var(--silver-3) 100%);
  box-shadow: inset 0 1px rgba(255,255,255,0.55);
}

.win-btn:active {
  box-shadow: inset 0 1px rgba(0,0,0,0.25);
}

.external-body {
  padding: 8px;
}

.external-body iframe {
  display: block;
  width: 100%;
  height: 80px;
  border: 2px solid var(--border);
  background: #000;
}

.footer {
  margin-top: 16px;
  text-align: center;
  color: azure;
  font-size: 6px;
  letter-spacing: 1px;
  opacity: 0.9;
}

/* ---------- Mobile ---------- */
@media (max-width: 768px) {
  body {
    background-position: center top;
  }

  .wrapper {
    margin: 0;
    max-width: 100%;
    padding: 8px;
  }

  .panel {
    padding: 12px;
  }

  .title-wrap {
    margin-bottom: 12px;
  }

  .title {
    font-size: 11px;
    line-height: 1.45;
    padding: 10px 52px;
  }

  .home-btn {
    left: 10px;
    right: auto;
    top: 50%;
    width: 28px;
    min-width: 28px;
    min-height: 28px;
    padding: 0;
    font-size: 0;
    gap: 0;
    box-shadow: inset 0 2px rgba(255,255,255,0.5), inset 0 -2px rgba(0,0,0,0.14), 1px 1px #3f1b13;
  }

  .home-btn > span:last-child {
    display: none;
  }

  .home-btn-icon {
    width: 16px;
    height: 16px;
    margin-top: 0;
    background: url("assets/symbols/home.png") center / contain no-repeat;
    image-rendering: pixelated;
  }

  .home-btn-icon::before,
  .home-btn-icon::after {
    content: none;
  }
}

@media (max-width: 500px) {
  .top-row { gap: 8px; margin-bottom: 12px; }
  .card-shell { padding: 8px; }
  .screen { font-size: 7px; padding: 8px; }
  .btn { font-size: 7px; padding: 8px 4px; }
  .info { font-size: 7.5px; padding: 7px; column-gap: 8px; }
  .album { padding: 5px; }
  .album p { font-size: 7px; padding: 5px 4px; }
  .album img { padding: 4px; }
  .external-module { margin-bottom: 12px; }
}
</style>
</head>
<body>

<section class="sr-only" aria-label="Production demos page description">
  <h1>Production Demos - Dom Shaw</h1>
  <p>Listen to production and mixing demos by Dom Shaw, including work with Waterlog, Cadmium Red, Eli Carvajal and Bastien.</p>
</section>

<div class="wrapper">
  <div class="panel">

    <div class="title-wrap">
      <a class="home-btn" href="index.html" aria-label="Back to home page">
        <span class="home-btn-icon" aria-hidden="true"></span>
        <span>HOME</span>
      </a>
      <div class="title">PRODUCTION DEMOS</div>
    </div>

    <div class="top-row">
      <div class="card-shell">
        <div class="player">
          <div id="screen" class="screen cursor">> SELECT A CARTRIDGE</div>
          <div class="controls">
            <!-- Buttons start disabled; enabled when a non-Spotify cartridge is loaded -->
            <div class="btn btn-play disabled" onclick="play()">PLAY</div>
            <div class="btn btn-stop disabled" onclick="stop()">STOP</div>
          </div>
        </div>
      </div>

      <div class="card-shell info-shell">
        <div class="info" id="info"></div>
      </div>
    </div>

    <div id="external" class="external-module">
      <div class="external-header">
        <div class="external-title" id="externalHeader">EXTERNAL STREAM</div>
        <div class="external-buttons">
          <div class="win-btn">_</div>
          <div class="win-btn">□</div>
          <div class="win-btn">×</div>
        </div>
      </div>
      <div class="external-body">
        <iframe id="spotifyFrame" src="about:blank" title="Spotify player"></iframe>
      </div>
    </div>

    <div class="discography" id="discography">
      <div class="cursor-arrow" id="cursor"></div>
    </div>

    <div class="footer">SYSTEM ONLINE</div>

  </div>
</div>

<script>
const albums=[
{title:"01 A_SC",audio:"assets/audio/asco.mp3",info:"SONG: A. SCOTT\nARTIST: WATERLOG\nCREDITS: PRODUCTION, PERFORMING, SONGWRITING",art:"assets/images/asco.png"},
{title:"02 DUST",audio:"assets/audio/dust.mp3",info:"SONG: DUST\nARTIST: CADMIUM RED\nCREDITS: CO-PRODUCTION, PERFORMING, ARRANGING",art:"assets/images/dust.png"},
{title:"03 BFLY",audio:"assets/audio/bfly.mp3",info:"SONG: BUTTERFLY EYES\nARTIST: WATERLOG\nCREDITS: PRODUCER, ARTIST, SONGWRITER",art:"assets/images/bfly.png"},
{title:"04 SCAR",audio:"assets/audio/scar.mp3",info:"SONG: SCAR\nARTIST: ELI CARVAJAL\nCREDITS: MIXING",art:"assets/images/scar.png"},
{title:"05 CONF",audio:"assets/audio/conf.mp3",info:"SONG: THE CONFERENCE\nARTIST: BASTIEN\nCREDITS: PRODUCTION, MIXING",art:"assets/images/conf.png"},
//{title:"05 NADA",audio:null,spotify:"https://open.spotify.com/embed/track/6QfHU8sGMN1wYrzUqrljAt",info:"SONG: NADA, NADA, NADA\nARTIST: BERNARDO\nCREDITS: MIXING",art:"assets/images/nada.png"},
{title:"06 MTNS",audio:"assets/audio/mtns.mp3",info:"SONG: MERTENS\nARTIST: WATERLOG\nCREDITS: PRODUCTION, PERFORMING, SONGWRITING",art:"assets/images/mtns.png"},
{title:"07 DO_I",audio:"assets/audio/dooi.mp3",info:"SONG: DO I\nARTIST: CADMIUM RED\nCREDITS: CO-PRODUCTION, PERFORMING, ARRANGING",art:"assets/images/dooi.png"},
{title:"08 TCSN",audio:"assets/audio/tcsn.mp3",info:"SONG: TOUCHSCREEN\nARTIST: WATERLOG\nCREDITS: PRODUCTION, PERFORMING, SONGWRITING",art:"assets/images/tcsn.png"},
{title:"09 ST_M",audio:"assets/audio/st_m.mp3",info:"SONG: STRETCH MARKS\nARTIST: ELI CARVAJAL\nCREDITS: MIXING",art:"assets/images/st_m.png"},
];

// Pre-load all local audio files into Audio objects up front
const audioCache = {};
albums.forEach(album => {
  if (album.audio) {
    const a = new Audio();
    a.preload = "auto";
    a.src = album.audio;
    audioCache[album.audio] = a;
  }
});

// Also preload the UI sound effects
let clickSound, whirrSound;
try {
  clickSound = new Audio('assets/audio/click.mp3');
  clickSound.preload = "auto";
  whirrSound = new Audio('assets/audio/whirr.mp3');
  whirrSound.preload = "auto";
} catch(e) {
  clickSound = { play:()=>{}, currentTime:0 };
  whirrSound = { play:()=>{}, currentTime:0 };
}

const discographyEl=document.getElementById("discography");
const cursorEl=document.getElementById("cursor");
const external=document.getElementById("external");
const spotifyFrame=document.getElementById("spotifyFrame");
const externalHeader=document.getElementById("externalHeader");
let current=null;let currentEl=null;
let audio=new Audio();

function replaceFrameLocation(url){
  try {
    if (spotifyFrame.contentWindow && spotifyFrame.contentWindow.location) {
      spotifyFrame.contentWindow.location.replace(url);
      return;
    }
  } catch (e) {}
  spotifyFrame.src = url;
}

function hideExternalModule(){
  external.style.display = "none";
  replaceFrameLocation("about:blank");
}

function showExternalModule(url){
  replaceFrameLocation(url);
  external.style.display = "block";
}

// Throttle: block repeated clicks within 500ms
let lastClick = 0;
function isThrottled() {
  const now = Date.now();
  if (now - lastClick < 500) return true;
  lastClick = now;
  return false;
}

function typeTextLines(lines,el){
  el.innerHTML="";
  let i=0;
  function next(){
    if(i>=lines.length) return;
    const [label,value]=lines[i];
    const l=document.createElement("div");
    l.className="label";
    l.textContent=label;
    const v=document.createElement("div");
    v.className="value";
    el.appendChild(l);
    el.appendChild(v);
    let c=0;
    function type(){
      if(c<value.length){
        v.textContent+=value[c++];
        setTimeout(type,15);
      } else { i++; setTimeout(next,120);} }
    type(); }
  next(); }

function renderAlbums(){
  albums.forEach((album,index)=>{
    const div=document.createElement("div");
    div.className="album";
    div.innerHTML=`<img src="${album.art}"><p>${album.title}</p>`;
    div.onclick=()=>selectAlbum(index,div);
    div.onmouseenter=()=>moveCursor(div);
    discographyEl.appendChild(div);
  });
}

function moveCursor(el){
  const rect=el.getBoundingClientRect();
  const parentRect=discographyEl.getBoundingClientRect();
  cursorEl.style.left=(rect.left-parentRect.left-10)+'px';
  cursorEl.style.top=(rect.top-parentRect.top+rect.height/2-4)+'px';
}

function selectAlbum(index,el){
  if(isThrottled()) return;

  audio.pause();
  audio.currentTime = 0;
  current=albums[index];
  
  const buttons = document.querySelectorAll(".btn");

  if(current.spotify){
    // Spotify cartridge: keep buttons disabled
    buttons.forEach(btn => btn.classList.add("disabled"));
  } else {
    // Local audio cartridge: activate buttons
    buttons.forEach(btn => btn.classList.remove("disabled"));
  }

  const sound = current.spotify ? whirrSound : clickSound;

  if(sound){
    try {
      sound.currentTime = 0;
      sound.play();
    } catch(e){}
  }

  if(currentEl) currentEl.classList.remove('loaded');
  currentEl=el;
  el.classList.add('loaded');

  moveCursor(el);

  document.getElementById("screen").textContent="> LOADING...";

  setTimeout(()=>{
    if(current.audio){
      // Swap in the pre-loaded Audio object from cache
      audio = audioCache[current.audio];
      audio.pause();
      audio.currentTime = 0;
      hideExternalModule();
      document.getElementById("screen").textContent="> LOADED "+current.title;
    } else if(current.spotify){
      hideExternalModule();
      document.getElementById("screen").textContent="> NO LOCAL FILE";

      setTimeout(()=>{
        document.getElementById("screen").textContent="> CONNECTING...";

        setTimeout(()=>{
          externalHeader.textContent="::EXTERNAL STREAM CONNECTED";
          showExternalModule(current.spotify);
        },400);
      },500);
    }

    const lines=current.info.split("\n").map(l=>{
      const p=l.split(":");
      return [p[0]+":",p[1]||""];
    });

    typeTextLines(lines,document.getElementById("info"));
  },400);
}

function play(){
  if(!current || current.spotify) return;
  if(current.audio){
    audio.play();
    document.getElementById("screen").textContent="> PLAYING";
  }
}

function stop(){
  if(current && current.spotify) return;
  audio.pause();
  audio.currentTime=0;
  document.getElementById("screen").textContent="> STOPPED";
}

renderAlbums();
</script>

</body>
</html>
