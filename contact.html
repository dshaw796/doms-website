<style>
@font-face {
  font-family: 'Press Start 2P';
  src: url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

:root {
  --ink: #1c1c1c;
  --shadow: #194242;
  --border: #333;
  --panel-border: #8c3b2a;
  --panel-deep: #5d2418;
  --silver-1: #f3f4f7;
  --silver-2: #d9dde4;
  --silver-3: #b7bcc5;
  --bubble-shadow: #3f1b13;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Press Start 2P', cursive;
}

body {
  background-image: url("assets/images/home3.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  min-height: 100vh;
  color: #083c3c;
}

.wrapper {
  max-width: 720px;
  margin: 28px auto;
  padding: 10px;
}

.panel {
  backdrop-filter: blur(2px);
  background: rgba(255,255,255,0.16);
  border: 3px solid var(--panel-border);
  padding: 14px;
  box-shadow: 4px 4px var(--shadow);
}

.panel-top {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 12px;
}

.home-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 34px;
  padding: 7px 10px;
  color: #414854;
  text-decoration: none;
  font-size: 7px;
  line-height: 1;
  border: 2px solid var(--border);
  background: linear-gradient(180deg, var(--silver-1) 0%, var(--silver-2) 45%, var(--silver-3) 100%);
  box-shadow: inset 0 2px rgba(255,255,255,0.55), inset 0 -2px rgba(0,0,0,0.12), 2px 2px var(--bubble-shadow);
  letter-spacing: 0.4px;
}

.home-btn:hover {
  transform: translateY(-1px);
}

.home-btn:active {
  transform: translateY(1px);
  box-shadow: inset 0 2px rgba(255,255,255,0.45), inset 0 -2px rgba(0,0,0,0.16), 1px 1px var(--bubble-shadow);
}

.home-btn-icon {
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  position: relative;
}

.home-btn-icon::before,
.home-btn-icon::after {
  content: '';
  position: absolute;
  background: #414854;
}

.home-btn-icon::before {
  left: 0;
  top: 4px;
  width: 7px;
  height: 4px;
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
}

.home-btn-icon::after {
  left: 5px;
  top: 4px;
  width: 7px;
  height: 4px;
}

.story-board {
  position: relative;
  width: min(100%, 900px);
  min-height: auto;
  margin: 0 auto;
  padding: 12px;
  border: 3px solid var(--panel-deep);
  background: linear-gradient(180deg, rgba(67, 34, 24, 0.18) 0%, rgba(255,255,255,0.16) 100%);
  box-shadow: inset 0 0 0 3px rgba(255, 241, 188, 0.12), 4px 4px #3f1b13;
  cursor: pointer;
  touch-action: manipulation;
}

.story-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.story-board.summary-mode {
  cursor: default;
}

.contact-head,
.contact-email {
  border: 3px solid var(--border);
  padding: 16px;
  font-size: 15px;
  line-height: 1.9;
  color: #fff7d6;
  background: rgba(0,0,0,0.35);
  box-shadow: inset 0 -3px rgba(0,0,0,0.16), 3px 3px #000;
  text-align: center;
}

.contact-email {
  font-size: clamp(12px, 2.2vw, 17px);
  color: #fcfcfc;
  background: rgba(6, 130, 99, 0.35);
}

.contact-email a {
  color: inherit;
  font-size: inherit;
  font-family: inherit;
  text-decoration: none;
}

.contact-email a:hover,
.contact-email a:focus {
  text-decoration: underline;
}

.contact-email .accent-letter {
  font-size: 115%;
}

/* ---- Sparkle / holofoil effect for "LET'S WORK TOGETHER" ---- */
.sparkle-text {
  position: relative;
  display: inline-block;
  background: linear-gradient(
    100deg,
    #fff7d6 0%,
    #fff7d6 35%,
    #ffffff 45%,
    #ffe98a 50%,
    #ffffff 55%,
    #fff7d6 65%,
    #fff7d6 100%
  );
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation: sparkle-shine 3.2s linear infinite;
  text-shadow: none;
}

/* Pixel sparkle bursts: each is a tiny plus-shaped 8-bit glint
   built from box-shadow "pixels" on a pseudo-element grid. */
.sparkle-text::before,
.sparkle-text::after {
  content: '';
  position: absolute;
  width: 6px;
  height: 6px;
  background: #fffbe0;
  box-shadow:
    0 -6px 0 #fffbe0,
    0 6px 0 #fffbe0,
    -6px 0 0 #fffbe0,
    6px 0 0 #fffbe0,
    0 0 6px 2px rgba(255, 250, 210, 0.9);
  image-rendering: pixelated;
  opacity: 0;
  pointer-events: none;
}

.sparkle-text::before {
  top: -6px;
  left: 2%;
  animation: sparkle-twinkle 2.6s ease-in-out infinite;
  animation-delay: 0.2s;
}

.sparkle-text::after {
  top: 50%;
  left: 96%;
  animation: sparkle-twinkle 2.6s ease-in-out infinite;
  animation-delay: 1.3s;
}

/* Extra glints, scoped tightly to the sparkle text itself so they
   never drift onto the "GET IN TOUCH HERE" line below. */
.sparkle-text {
  overflow: visible;
}

.sparkle-text .sparkle-dot {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #fffde8;
  box-shadow:
    0 -4px 0 #fffde8,
    0 4px 0 #fffde8,
    -4px 0 0 #fffde8,
    4px 0 0 #fffde8,
    0 0 5px 2px rgba(255, 253, 232, 0.85);
  opacity: 0;
  pointer-events: none;
  animation: sparkle-twinkle 2.4s ease-in-out infinite;
}

/* Positioned across the full width of the text in a staggered
   top/middle/bottom pattern, kept close enough to the glyphs that
   they never spill into the rest of the box. */
.sparkle-dot:nth-of-type(1) { top: -8px;  left: 4%;  animation-delay: 0s; }
.sparkle-dot:nth-of-type(2) { top: 55%;   left: 20%; animation-delay: 1.1s; }
.sparkle-dot:nth-of-type(3) { top: -6px;  left: 34%; animation-delay: 0.5s; }
.sparkle-dot:nth-of-type(4) { top: 60%;   left: 48%; animation-delay: 1.7s; }
.sparkle-dot:nth-of-type(5) { top: -7px;  left: 62%; animation-delay: 0.9s; }
.sparkle-dot:nth-of-type(6) { top: 58%;   left: 76%; animation-delay: 0.3s; }
.sparkle-dot:nth-of-type(7) { top: -8px;  left: 90%; animation-delay: 1.4s; }

@keyframes sparkle-shine {
  0% { background-position: 200% 0; }
  100% { background-position: -50% 0; }
}

@keyframes sparkle-twinkle {
  0%, 100% {
    opacity: 0;
    transform: scale(0.4);
  }
  45% {
    opacity: 0;
    transform: scale(0.4);
  }
  55% {
    opacity: 1;
    transform: scale(1);
  }
  70% {
    opacity: 0;
    transform: scale(0.6);
  }
}

@media (prefers-reduced-motion: reduce) {
  .sparkle-text {
    animation: none;
    background-position: 0% 0;
  }
  .sparkle-text::before,
  .sparkle-text::after,
  .sparkle-dot {
    animation: none;
    opacity: 0;
  }
}

@media (max-width: 860px) {
  .wrapper {
    max-width: 760px;
    margin: 18px auto;
    padding: 8px;
  }

  .story-board {
    padding: 10px;
  }
}

@media (max-width: 768px) {
  body {
    background-position: center top;
  }

  .wrapper {
    margin: 0;
    max-width: 100%;
    padding: 6px;
  }

  .panel {
    padding: 10px;
  }

  .panel-top {
    margin-bottom: 10px;
  }

  .home-btn {
    min-height: 30px;
    padding: 6px 8px;
    font-size: 6px;
    gap: 4px;
  }

  .story-board {
    padding: 8px;
    min-height: auto;
  }

  .story-board.summary-mode {
    min-height: auto;
  }

  .story-stack {
    gap: 14px;
    min-height: auto;
  }

  .contact-head {
    text-align: center;
    font-size: 16px;
  }

  .contact-email {
    padding-left: 8px;
    padding-right: 8px;
    font-size: clamp(9px, 2.75vw, 17px);
    text-align: center;
  }
}
</style>
</head>
