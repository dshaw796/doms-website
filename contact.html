<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<meta name="description" content="Dom Shaw is a Grammy Award-winning engineer and multi-instrumentalist frontman of Waterlog.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="/contact.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact - Dom Shaw">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Contact",
  "name": "Dom Shaw Contact",
  "description": "A Contact page for the music producer, engineer, songwriter and musician Dom Shaw",
  "about": {
    "@type": "Person",
    "name": "Dom Shaw",
    "jobTitle": "Music Producer, Recording Engineer, Mixing Engineer, Songwriter",
    "memberOf": {
      "@type": "MusicGroup",
      "name": "Waterlog"
    }
  }
}
</script>
<style>
@font-face {
  font-family: 'Press Start 2P';
  src: url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

:root {
  --ink: #1c1c1c;
  --shadow: #194242;
  --border: #333;
  --panel-border: #8c3b2a;
  --panel-deep: #5d2418;
  --silver-1: #f3f4f7;
  --silver-2: #d9dde4;
  --silver-3: #b7bcc5;
  --bubble-shadow: #3f1b13;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Press Start 2P', cursive;
}

body {
  background-image: url("assets/images/home3.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  min-height: 100vh;
  color: #083c3c;
}

.wrapper {
  max-width: 980px;
  margin: 28px auto;
  padding: 10px;
}

.panel {
  backdrop-filter: blur(2px);
  background: rgba(255,255,255,0.16);
  border: 3px solid var(--panel-border);
  padding: 14px;
  box-shadow: 4px 4px var(--shadow);
}

.panel-top {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 12px;
}

.home-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 34px;
  padding: 7px 10px;
  color: #414854;
  text-decoration: none;
  font-size: 7px;
  line-height: 1;
  border: 2px solid var(--border);
  background: linear-gradient(180deg, var(--silver-1) 0%, var(--silver-2) 45%, var(--silver-3) 100%);
  box-shadow: inset 0 2px rgba(255,255,255,0.55), inset 0 -2px rgba(0,0,0,0.12), 2px 2px var(--bubble-shadow);
  letter-spacing: 0.4px;
}

.home-btn:hover {
  transform: translateY(-1px);
}

.home-btn:active {
  transform: translateY(1px);
  box-shadow: inset 0 2px rgba(255,255,255,0.45), inset 0 -2px rgba(0,0,0,0.16), 1px 1px var(--bubble-shadow);
}

.home-btn-icon {
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  position: relative;
}

.home-btn-icon::before,
.home-btn-icon::after {
  content: '';
  position: absolute;
  background: #414854;
}

.home-btn-icon::before {
  left: 0;
  top: 4px;
  width: 7px;
  height: 4px;
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
}

.home-btn-icon::after {
  left: 5px;
  top: 4px;
  width: 7px;
  height: 4px;
}

.story-board {
  position: relative;
  width: min(100%, 900px);
  min-height: auto;
  margin: 0 auto;
  padding: 12px;
  border: 3px solid var(--panel-deep);
  background: linear-gradient(180deg, rgba(67, 34, 24, 0.18) 0%, rgba(255,255,255,0.16) 100%);
  box-shadow: inset 0 0 0 3px rgba(255, 241, 188, 0.12), 4px 4px #3f1b13;
  cursor: pointer;
  touch-action: manipulation;
}

.story-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.story-board.summary-mode {
  cursor: default;
}

.contact-head,
.contact-email {
  border: 3px solid var(--border);
  padding: 16px;
  font-size: 16px;
  line-height: 1.9;
  color: #fff7d6;
  background: rgba(0,0,0,0.35);
  box-shadow: inset 0 -3px rgba(0,0,0,0.16), 3px 3px #000;
}

.contact-email {
  font-size: 20px;
  color: #fcfcfc;
  background: rgba(6, 130, 99, 0.35);
}

.contact-email a {
  color: inherit;
  font-size: inherit;
  font-family: inherit;
  text-decoration: none;
}

.contact-email a:hover,
.contact-email a:focus {
  text-decoration: underline;
}

@media (max-width: 860px) {
  .wrapper {
    max-width: 760px;
    margin: 18px auto;
    padding: 8px;
  }

  .story-board {
    padding: 10px;
  }
}

@media (max-width: 768px) {
  body {
    background-position: center top;
  }

  .wrapper {
    margin: 0;
    max-width: 100%;
    padding: 6px;
  }

  .panel {
    padding: 10px;
  }

  .panel-top {
    margin-bottom: 10px;
  }

  .home-btn {
    min-height: 30px;
    padding: 6px 8px;
    font-size: 6px;
    gap: 4px;
  }

  .story-board {
    padding: 8px;
    min-height: auto;
  }

  .story-board.summary-mode {
    min-height: auto;
  }

  .story-stack {
    gap: 14px;
    min-height: auto;
  }

  .contact-head {
    font-size: 16px;
  }

  .contact-email {
    font-size: 12px;
  }
}
</style>
</head>
<body>
  <section class="sr-only" aria-label="Contact page description">
  <h1>Contact - Dom Shaw</h1>
  <p>A page for contacting Dom Shaw - Music Producer, Engineer, Musician & Songwriter</p>
</section>
  <div class="wrapper">
    <div class="panel">
      <div class="panel-top">
        <a class="home-btn" href="index.html" aria-label="Back to home page">
          <span class="home-btn-icon" aria-hidden="true"></span>
          <span>HOME</span>
        </a>
      </div>

      <main class="story-board summary-mode" id="storyBoard" aria-live="polite" tabindex="-1">
        <div class="story-stack" id="storyStack">
          <div class="contact-head">LET'S WORK TOGETHER! <br>GET IN TOUCH HERE: </div>
          <div class="contact-email"><a href="mailto:domshawrecordings@gmail.com">DOMSHAWRECORDINGS@GMAIL.COM</a></div>
        </div>
      </main>
    </div>
  </div>

</body>
</html>
